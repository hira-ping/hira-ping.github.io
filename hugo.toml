baseURL = "https://hira-ping.github.io/"
languageCode = 'ja'
timeZone = "Asia/Tokyo"
title = 'hira-ping'
theme = 'relearn'

# --- Relearnテーマの基本設定 ---
[params]
  # KaTeX（数式描画エンジン）をサイト全体で有効化
  mathJaxInitialize = "{}" # もしMathJaxを使う場合はこちらを設定しますが、今回はKaTeXを推奨として進めます。RelearnはデフォルトでMathJax/KaTeXに対応しています。
  # サイト全体で数式を有効化するRelearnの設定
  math = true 
  collapsibleMenu = true
  alwaysopen = false
  themeVariant = "zen-light"
  externalLinkTarget = "_blank"

# --- 【最重要】数式のMarkdown誤変換を防ぐ設定 ---
[markup.goldmark.extensions]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

[markup.goldmark.parser]
  [markup.goldmark.parser.attribute]
    block = true

